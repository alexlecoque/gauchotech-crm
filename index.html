<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GauchoTech CRM</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --color-bg:#ffffff;
    --color-bg-secondary:#f0f2f7;
    --color-bg-tertiary:#e4e8f2;
    --color-text-primary:#003660;
    --color-text-secondary:#5a6e85;
    --color-border-tertiary:rgba(0,54,96,0.12);
    --color-border-secondary:rgba(0,54,96,0.25);
    --color-bg-info:#fff8e6;
    --color-text-info:#b08d00;
    --color-accent:#003660;
    --color-gold:#febc11;
    --color-gold-dark:#b08d00;
    --radius-md:8px;
    --radius-lg:12px;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --color-bg:#001e36;
      --color-bg-secondary:#002a4a;
      --color-bg-tertiary:#00213d;
      --color-text-primary:#e8f0f8;
      --color-text-secondary:#7a9ab8;
      --color-border-tertiary:rgba(254,188,17,0.15);
      --color-border-secondary:rgba(254,188,17,0.3);
      --color-bg-info:#2a1f00;
      --color-text-info:#febc11;
      --color-accent:#febc11;
      --color-gold:#febc11;
      --color-gold-dark:#febc11;
    }
  }
  body{font-family:var(--font);background:var(--color-bg-tertiary);color:var(--color-text-primary);min-height:100vh;padding:0;border-top:4px solid #febc11}
  a{color:var(--color-text-info)}
  input,select,textarea{background:var(--color-bg);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--radius-md);padding:7px 10px;font-family:var(--font);font-size:13px;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--color-text-info);box-shadow:0 0 0 2px rgba(24,95,165,0.15)}
  textarea{height:72px;resize:vertical}

  .app{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .logo{font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#003660}
  .logo span{color:#febc11;font-weight:700}
  .saved-ts{font-size:12px;color:var(--color-text-secondary)}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
  .stat{background:var(--color-bg-secondary);border-radius:var(--radius-md);padding:12px 14px}
  .stat-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
  .stat-val{font-size:24px;font-weight:500}

  .tabs{display:flex;gap:4px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:1.5rem}
  .tab{padding:8px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--color-text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font)}
  .tab.active{color:#003660;border-bottom-color:#febc11;font-weight:500}

  .section{display:none}.section.active{display:block}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
  .toolbar-label{font-size:13px;color:var(--color-text-secondary)}

  .btn{padding:6px 14px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--radius-md);background:var(--color-bg);cursor:pointer;color:var(--color-text-primary);font-family:var(--font)}
  .btn:hover{background:var(--color-bg-secondary)}
  .btn.primary{background:#003660;color:#febc11;border-color:#003660}
  .btn.primary:hover{opacity:0.85}
  .btn.sm{padding:3px 10px;font-size:11px}
  .btn.danger{border-color:#a32d2d;color:#a32d2d}
  .btn.danger:hover{background:#fcebeb}

  .stage-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .stage{background:var(--color-bg-secondary);border-radius:var(--radius-lg);padding:10px}
  .stage-header{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .badge{background:var(--color-bg-tertiary);border-radius:999px;padding:1px 7px;font-size:10px;color:var(--color-text-secondary)}
  .lead-card{background:var(--color-bg);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);padding:10px;margin-bottom:6px;cursor:grab;user-select:none}
  .lead-card:active{cursor:grabbing}
  .lead-card:hover{border-color:var(--color-border-secondary)}
  .lead-card.dragging{opacity:0.35}
  .stage.drag-over{outline:2px dashed #febc11;outline-offset:-3px;background:var(--color-bg-tertiary)}
  .lead-name{font-size:13px;font-weight:500;margin-bottom:2px}
  .lead-meta{font-size:11px;color:var(--color-text-secondary)}
  .lead-empty{font-size:12px;color:var(--color-text-secondary);padding:8px 4px}
  .card-edit-btn{font-size:10px;padding:2px 8px;margin-top:6px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-md);background:none;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font)}
  .card-edit-btn:hover{background:var(--color-bg-secondary);color:var(--color-text-primary)}

  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--color-bg);border-radius:var(--radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary)}
  th{text-align:left;padding:9px 12px;font-weight:500;font-size:11px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);text-transform:uppercase;letter-spacing:.04em;background:var(--color-bg-secondary)}
  td{padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--color-bg-secondary)}
  .empty-row td{text-align:center;padding:2rem;color:var(--color-text-secondary)}

  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
  .pill-active{background:#e6f0ff;color:#003660}
  .pill-pilot{background:#fff8e6;color:#7a5800}
  .pill-inactive{background:#f0f2f7;color:#5a6e85}
  .pill-in{background:#e6f0ff;color:#003660}
  .pill-out{background:#fff8e6;color:#7a5800}
  .pill-missed{background:#fdf0f0;color:#a32d2d}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:flex-start;justify-content:center;padding-top:80px}
  .modal-overlay.open{display:flex}
  .modal-box{background:var(--color-bg);border-radius:var(--radius-lg);border:0.5px solid var(--color-border-secondary);padding:1.5rem;width:100%;max-width:460px;max-height:80vh;overflow-y:auto}
  .modal-title{font-size:15px;font-weight:600;margin-bottom:1.25rem}
  .form-row{margin-bottom:10px}
  .form-row label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}

  .detail-panel{display:none}.detail-panel.open{display:block}
  .back-btn{font-size:12px;color:var(--color-text-secondary);cursor:pointer;margin-bottom:1rem;background:none;border:none;padding:0;font-family:var(--font)}
  .back-btn:hover{color:var(--color-text-primary)}
  .detail-card{background:var(--color-bg);border:0.5px solid var(--color-border-tertiary);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px;margin-top:12px}
  .detail-key{color:var(--color-text-secondary)}
  .detail-val{font-weight:500}
  .section-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin:1.25rem 0 8px}
  .note-item{background:var(--color-bg-secondary);border-radius:var(--radius-md);padding:10px;margin-bottom:6px;font-size:13px}
  .note-date{font-size:11px;color:var(--color-text-secondary);margin-top:4px}
  .avatar{width:44px;height:44px;border-radius:50%;background:#003660;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#febc11;flex-shrink:0}

  @media(max-width:600px){
    .stat-row{grid-template-columns:repeat(2,1fr)}
    .stage-cols{grid-template-columns:1fr 1fr}
    .app{padding:1rem}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="logo">GauchoTech <span>CRM</span></div>
    <div class="saved-ts" id="last-saved"></div>
  </div>

  <div class="stat-row" id="stats-row"></div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('pipeline')">Pipeline</button>
    <button class="tab" onclick="showTab('customers')">Customers</button>
    <button class="tab" onclick="showTab('calls')">Call log</button>
  </div>

  <!-- PIPELINE -->
  <div class="section active" id="sec-pipeline">
    <div class="toolbar">
      <span class="toolbar-label">Drag cards between columns · click Edit to update a lead</span>
      <button class="btn primary" onclick="openModal('lead')">+ Add lead</button>
    </div>
    <div class="stage-cols" id="pipeline-board"></div>
  </div>

  <!-- CUSTOMERS -->
  <div class="section" id="sec-customers">
    <div id="customers-list-view">
      <div class="toolbar">
        <span class="toolbar-label" id="cust-count"></span>
        <button class="btn primary" onclick="openModal('customer')">+ Add customer</button>
      </div>
      <table>
        <thead><tr><th>Restaurant</th><th>Owner</th><th>City</th><th>Status</th><th>Since</th><th></th></tr></thead>
        <tbody id="customers-tbody"></tbody>
      </table>
    </div>
    <div class="detail-panel" id="customer-detail">
      <button class="back-btn" onclick="closeDetail()">← Back to customers</button>
      <div id="customer-detail-content"></div>
    </div>
  </div>

  <!-- CALLS -->
  <div class="section" id="sec-calls">
    <div class="toolbar">
      <span class="toolbar-label" id="calls-count"></span>
      <button class="btn primary" onclick="openModal('call')">+ Log call</button>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Restaurant</th><th>Contact</th><th>Direction</th><th>Duration</th><th>Outcome</th><th></th></tr></thead>
      <tbody id="calls-tbody"></tbody>
    </table>
  </div>

</div>

<!-- MODAL: ADD LEAD -->
<div class="modal-overlay" id="modal-lead">
  <div class="modal-box">
    <div class="modal-title">Add lead</div>
    <div class="form-row"><label>Restaurant name *</label><input id="l-name" placeholder="e.g. Tony's Pizza"></div>
    <div class="form-row"><label>Owner name</label><input id="l-owner" placeholder="e.g. Tony Russo"></div>
    <div class="form-row"><label>Phone</label><input id="l-phone" placeholder="(805) 555-0000"></div>
    <div class="form-row"><label>City</label><input id="l-city" placeholder="e.g. Santa Barbara"></div>
    <div class="form-row"><label>Stage</label>
      <select id="l-stage">
        <option value="prospect">Prospect</option>
        <option value="contacted">Contacted</option>
        <option value="demo">Demo scheduled</option>
        <option value="closed">Closed / won</option>
      </select>
    </div>
    <div class="form-row"><label>Notes</label><textarea id="l-notes" placeholder="How did we find them? Any context..."></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('lead')">Cancel</button>
      <button class="btn primary" onclick="saveLead()">Save lead</button>
    </div>
  </div>
</div>

<!-- MODAL: EDIT LEAD -->
<div class="modal-overlay" id="modal-move">
  <div class="modal-box">
    <div class="modal-title">Edit lead</div>
    <div class="form-row"><label>Restaurant name *</label><input id="e-name" placeholder="e.g. Tony's Pizza"></div>
    <div class="form-row"><label>Owner name</label><input id="e-owner" placeholder="e.g. Tony Russo"></div>
    <div class="form-row"><label>Phone</label><input id="e-phone" placeholder="(805) 555-0000"></div>
    <div class="form-row"><label>City</label><input id="e-city" placeholder="e.g. Santa Barbara"></div>
    <div class="form-row"><label>Stage</label>
      <select id="move-stage">
        <option value="prospect">Prospect</option>
        <option value="contacted">Contacted</option>
        <option value="demo">Demo scheduled</option>
        <option value="closed">Closed / won</option>
      </select>
    </div>
    <div class="form-row"><label>Notes</label><textarea id="e-notes" placeholder="Any context..."></textarea></div>
    <div class="modal-actions">
      <button class="btn danger" onclick="deleteLead()">Delete</button>
      <button class="btn" onclick="closeModal('move')">Cancel</button>
      <button class="btn primary" onclick="confirmMove()">Save changes</button>
    </div>
  </div>
</div>

<!-- MODAL: ADD CUSTOMER -->
<div class="modal-overlay" id="modal-customer">
  <div class="modal-box">
    <div class="modal-title">Add customer</div>
    <div class="form-row"><label>Restaurant name *</label><input id="c-name" placeholder="e.g. Californo Pizza"></div>
    <div class="form-row"><label>Owner name</label><input id="c-owner" placeholder="e.g. Alberto Diaz"></div>
    <div class="form-row"><label>Phone</label><input id="c-phone" placeholder="(805) 555-0000"></div>
    <div class="form-row"><label>City</label><input id="c-city" placeholder="e.g. Santa Barbara"></div>
    <div class="form-row"><label>Status</label>
      <select id="c-status">
        <option value="pilot">Pilot</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="form-row"><label>Monthly calls (approx)</label><input id="c-calls" type="number" placeholder="e.g. 120"></div>
    <div class="form-row"><label>Square merchant ID</label><input id="c-square" placeholder="optional"></div>
    <div class="form-row"><label>Notes</label><textarea id="c-notes" placeholder="Onboarding notes, special config..."></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('customer')">Cancel</button>
      <button class="btn primary" onclick="saveCustomer()">Save customer</button>
    </div>
  </div>
</div>

<!-- MODAL: LOG CALL -->
<div class="modal-overlay" id="modal-call">
  <div class="modal-box">
    <div class="modal-title">Log call</div>
    <div class="form-row"><label>Restaurant *</label><input id="ca-rest" placeholder="e.g. Californo Pizza"></div>
    <div class="form-row"><label>Contact name</label><input id="ca-contact" placeholder="e.g. Alberto"></div>
    <div class="form-row"><label>Date</label><input id="ca-date" type="date"></div>
    <div class="form-row"><label>Direction</label>
      <select id="ca-dir">
        <option value="outbound">Outbound</option>
        <option value="inbound">Inbound</option>
        <option value="missed">Missed</option>
      </select>
    </div>
    <div class="form-row"><label>Duration (mins)</label><input id="ca-dur" type="number" placeholder="e.g. 15"></div>
    <div class="form-row"><label>Outcome / summary</label><textarea id="ca-outcome" placeholder="What was discussed? Next steps?"></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('call')">Cancel</button>
      <button class="btn primary" onclick="saveCall()">Save call</button>
    </div>
  </div>
</div>

<script>
const STAGES=['prospect','contacted','demo','closed'];
const STAGE_LABELS={prospect:'Prospect',contacted:'Contacted',demo:'Demo scheduled',closed:'Closed / won'};

function load(k){try{return JSON.parse(localStorage.getItem('gtcrm_'+k)||'[]')}catch{return[]}}
function save(k,v){localStorage.setItem('gtcrm_'+k,JSON.stringify(v));updateSaved()}
function updateSaved(){const el=document.getElementById('last-saved');if(el)el.textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

let leads=load('leads'),customers=load('customers'),calls=load('calls');
let movingLeadId=null;

function renderStats(){
  const el=document.getElementById('stats-row');
  const activeC=customers.filter(c=>c.status==='active').length;
  const pilotC=customers.filter(c=>c.status==='pilot').length;
  const n=new Date();
  const thisMonth=calls.filter(c=>{const d=new Date(c.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}).length;
  el.innerHTML=`
    <div class="stat"><div class="stat-label">Total leads</div><div class="stat-val">${leads.length}</div></div>
    <div class="stat"><div class="stat-label">Active customers</div><div class="stat-val">${activeC}</div></div>
    <div class="stat"><div class="stat-label">Pilots</div><div class="stat-val">${pilotC}</div></div>
    <div class="stat"><div class="stat-label">Calls this month</div><div class="stat-val">${thisMonth}</div></div>
  `;
}

function renderPipeline(){
  const board=document.getElementById('pipeline-board');
  board.innerHTML='';
  STAGES.forEach(stage=>{
    const items=leads.filter(l=>l.stage===stage);
    const col=document.createElement('div');
    col.className='stage';col.dataset.stage=stage;
    col.innerHTML=`<div class="stage-header"><span>${STAGE_LABELS[stage]}</span><span class="badge">${items.length}</span></div>`;
    if(!items.length){col.innerHTML+=`<div class="lead-empty">Drop here</div>`;}
    items.forEach(l=>{
      const card=document.createElement('div');
      card.className='lead-card';card.draggable=true;card.dataset.id=l.id;
      card.innerHTML=`<div class="lead-name">${l.name}</div><div class="lead-meta">${l.owner||''}</div>${l.city?`<div class="lead-meta">${l.city}</div>`:''}<button class="card-edit-btn">Edit</button>`;
      card.querySelector('.card-edit-btn').addEventListener('click',e=>{e.stopPropagation();openEditModal(l.id);});
      card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',l.id);setTimeout(()=>card.classList.add('dragging'),0);});
      card.addEventListener('dragend',()=>card.classList.remove('dragging'));
      col.appendChild(card);
    });
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('drag-over');});
    col.addEventListener('drop',e=>{
      e.preventDefault();col.classList.remove('drag-over');
      const id=e.dataTransfer.getData('text/plain');
      const l=leads.find(x=>x.id===id);
      if(l&&l.stage!==stage){l.stage=stage;save('leads',leads);leads=load('leads');renderPipeline();renderStats();}
    });
    board.appendChild(col);
  });
}

function openEditModal(id){
  movingLeadId=id;
  const l=leads.find(x=>x.id===id);
  document.getElementById('e-name').value=l.name||'';
  document.getElementById('e-owner').value=l.owner||'';
  document.getElementById('e-phone').value=l.phone||'';
  document.getElementById('e-city').value=l.city||'';
  document.getElementById('e-notes').value=l.notes||'';
  document.getElementById('move-stage').value=l.stage;
  document.getElementById('modal-move').classList.add('open');
}
function openMoveModal(id){openEditModal(id);}

function renderCustomers(){
  const tbody=document.getElementById('customers-tbody');
  const count=document.getElementById('cust-count');
  count.textContent=customers.length+' customer'+(customers.length===1?'':'s');
  if(!customers.length){tbody.innerHTML=`<tr class="empty-row"><td colspan="6">No customers yet</td></tr>`;return;}
  tbody.innerHTML=customers.map(c=>`
    <tr>
      <td style="font-weight:500">${c.name}</td>
      <td>${c.owner||'—'}</td>
      <td>${c.city||'—'}</td>
      <td><span class="pill pill-${c.status}">${c.status}</span></td>
      <td style="color:var(--color-text-secondary)">${c.since||'—'}</td>
      <td><button class="btn sm" onclick="showCustomerDetail('${c.id}')">View</button></td>
    </tr>
  `).join('');
}

function showCustomerDetail(id){
  const c=customers.find(x=>x.id===id);if(!c)return;
  const relCalls=calls.filter(x=>x.restaurant.toLowerCase().includes(c.name.toLowerCase().slice(0,6)));
  document.getElementById('customers-list-view').style.display='none';
  const panel=document.getElementById('customer-detail');
  panel.classList.add('open');
  panel.querySelector('#customer-detail-content').innerHTML=`
    <div class="detail-card">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar">${(c.name||'?').slice(0,1).toUpperCase()}</div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:600">${c.name}</div>
          <div style="font-size:13px;color:var(--color-text-secondary)">${c.city||''}</div>
        </div>
        <span class="pill pill-${c.status}">${c.status}</span>
      </div>
      <div class="detail-grid">
        <div class="detail-key">Owner</div><div class="detail-val">${c.owner||'—'}</div>
        <div class="detail-key">Phone</div><div class="detail-val">${c.phone||'—'}</div>
        <div class="detail-key">Monthly calls</div><div class="detail-val">${c.monthlyCalls||'—'}</div>
        <div class="detail-key">Square ID</div><div class="detail-val" style="font-size:12px;font-family:monospace">${c.squareId||'—'}</div>
        <div class="detail-key">Customer since</div><div class="detail-val">${c.since||'—'}</div>
      </div>
      ${c.notes?`<div style="margin-top:12px;font-size:13px;color:var(--color-text-secondary);border-top:0.5px solid var(--color-border-tertiary);padding-top:10px">${c.notes}</div>`:''}
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
      <button class="btn danger" onclick="deleteCustomer('${c.id}')">Delete customer</button>
    </div>
    <div class="section-label">Call history (${relCalls.length})</div>
    ${relCalls.length===0
      ?'<div style="font-size:13px;color:var(--color-text-secondary)">No calls logged yet</div>'
      :relCalls.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(ca=>`
        <div class="note-item">
          <div style="font-weight:500">${ca.outcome||'Call logged'}</div>
          <div class="note-date">${ca.date} · ${ca.direction} ${ca.duration?'· '+ca.duration+' min':''}</div>
        </div>`).join('')}
  `;
}

function closeDetail(){
  document.getElementById('customers-list-view').style.display='';
  document.getElementById('customer-detail').classList.remove('open');
}

function deleteCustomer(id){
  if(!confirm('Delete this customer?'))return;
  customers=customers.filter(x=>x.id!==id);
  save('customers',customers);
  closeDetail();renderCustomers();renderStats();
}

function renderCalls(){
  const tbody=document.getElementById('calls-tbody');
  const count=document.getElementById('calls-count');
  count.textContent=calls.length+' call'+(calls.length===1?'':'s')+' logged';
  if(!calls.length){tbody.innerHTML=`<tr class="empty-row"><td colspan="7">No calls logged yet</td></tr>`;return;}
  const sorted=[...calls].sort((a,b)=>new Date(b.date)-new Date(a.date));
  tbody.innerHTML=sorted.map(c=>`
    <tr>
      <td style="color:var(--color-text-secondary);white-space:nowrap">${c.date}</td>
      <td style="font-weight:500">${c.restaurant}</td>
      <td>${c.contact||'—'}</td>
      <td><span class="pill pill-${c.direction==='inbound'?'in':c.direction==='outbound'?'out':'missed'}">${c.direction}</span></td>
      <td>${c.duration?c.duration+' min':'—'}</td>
      <td style="max-width:180px">${c.outcome||'—'}</td>
      <td><button class="btn sm danger" onclick="deleteCall('${c.id}')">Delete</button></td>
    </tr>
  `).join('');
}

function deleteCall(id){
  if(!confirm('Delete this call log?'))return;
  calls=calls.filter(x=>x.id!==id);
  save('calls',calls);renderCalls();renderStats();
}

function showTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',['pipeline','customers','calls'][i]===t)});
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('sec-'+t).classList.add('active');
}

function openModal(type){
  if(type==='call'){document.getElementById('ca-date').value=new Date().toISOString().slice(0,10)}
  document.getElementById('modal-'+type).classList.add('open');
}
function closeModal(type){document.getElementById('modal-'+type).classList.remove('open')}

document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open')});
});

function confirmMove(){
  const name=document.getElementById('e-name').value.trim();if(!name)return;
  const l=leads.find(x=>x.id===movingLeadId);
  if(l){
    l.name=name;
    l.owner=document.getElementById('e-owner').value.trim();
    l.phone=document.getElementById('e-phone').value.trim();
    l.city=document.getElementById('e-city').value.trim();
    l.notes=document.getElementById('e-notes').value.trim();
    l.stage=document.getElementById('move-stage').value;
    save('leads',leads);leads=load('leads');renderPipeline();renderStats();
  }
  closeModal('move');
}
function deleteLead(){
  if(!confirm('Delete this lead?'))return;
  leads=leads.filter(x=>x.id!==movingLeadId);
  save('leads',leads);leads=load('leads');
  closeModal('move');renderPipeline();renderStats();
}

function saveLead(){
  const name=document.getElementById('l-name').value.trim();if(!name)return;
  leads.push({id:uid(),name,owner:document.getElementById('l-owner').value.trim(),phone:document.getElementById('l-phone').value.trim(),city:document.getElementById('l-city').value.trim(),stage:document.getElementById('l-stage').value,notes:document.getElementById('l-notes').value.trim(),added:new Date().toISOString().slice(0,10)});
  save('leads',leads);leads=load('leads');
  ['l-name','l-owner','l-phone','l-city','l-notes'].forEach(id=>document.getElementById(id).value='');
  closeModal('lead');renderPipeline();renderStats();
}

function saveCustomer(){
  const name=document.getElementById('c-name').value.trim();if(!name)return;
  customers.push({id:uid(),name,owner:document.getElementById('c-owner').value.trim(),phone:document.getElementById('c-phone').value.trim(),city:document.getElementById('c-city').value.trim(),status:document.getElementById('c-status').value,monthlyCalls:document.getElementById('c-calls').value.trim(),squareId:document.getElementById('c-square').value.trim(),notes:document.getElementById('c-notes').value.trim(),since:new Date().toISOString().slice(0,10)});
  save('customers',customers);customers=load('customers');
  ['c-name','c-owner','c-phone','c-city','c-calls','c-square','c-notes'].forEach(id=>document.getElementById(id).value='');
  closeModal('customer');renderCustomers();renderStats();
}

function saveCall(){
  const rest=document.getElementById('ca-rest').value.trim();if(!rest)return;
  calls.push({id:uid(),restaurant:rest,contact:document.getElementById('ca-contact').value.trim(),date:document.getElementById('ca-date').value,direction:document.getElementById('ca-dir').value,duration:document.getElementById('ca-dur').value.trim(),outcome:document.getElementById('ca-outcome').value.trim()});
  save('calls',calls);calls=load('calls');
  ['ca-rest','ca-contact','ca-dur','ca-outcome'].forEach(id=>document.getElementById(id).value='');
  closeModal('call');renderCalls();renderStats();
}

renderStats();renderPipeline();renderCustomers();renderCalls();
</script>
</body>
</html>
